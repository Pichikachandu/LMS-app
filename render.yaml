services:
  - type: web
    name: lms-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Node Environment
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      
      # MongoDB Configuration
      - key: MONGODB_URL
        value: mongodb+srv://chandupichika:chandu0410@cluster0.qcax6pu.mongodb.net/lms?retryWrites=true&w=majority
      
      # JWT Configuration
      - key: JWT_SECRET
        generateValue: true
      
      # Email Configuration
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_MAIL
        value: chandupichika0@gmail.com
      - key: SMTP_PASSWORD
        value: bkso byin vifk vzwm  # App Password from Gmail
      
      # Frontend URL (Update this with your production frontend URL)
      - key: FRONTEND_URL
        value: https://your-frontend-url.com
      
      # Cloudinary Configuration (You'll need to add these values in Render dashboard)
      - key: CLOUDINARY_CLOUD_NAME
        value: your_cloud_name
      - key: CLOUDINARY_API_KEY
        value: your_api_key
      - key: CLOUDINARY_API_SECRET
        value: your_api_secret
      - key: CLOUDINARY_UPLOAD_PRESET
        value: your_upload_preset
    
    plan: free
    region: singapore
    healthCheckPath: /api/health

